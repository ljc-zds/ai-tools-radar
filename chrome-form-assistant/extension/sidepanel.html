<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>外链助手</title></head><body>
<header><div class="heading"><h1>外链助手 <small>v0.6.0</small></h1><button id="onboard" class="text-button">设置</button></div><p id="status" role="status" aria-live="polite">正在加载本机资料…</p><div class="task-actions"><button id="resumeAuto" hidden>继续填写</button><button id="cancelAuto" class="text-button" hidden>取消</button></div></header>
<main><div class="selection"><label>产品<select id="product"></select></label><label>场景<select id="mode"><option value="blog">博客评论</option><option value="directory">目录站</option></select></label></div>
<button id="fillCurrent" class="primary">填写并提交当前页</button><small class="manual-note">自动填写并提交一次；验证码、登录或结果未知时暂停</small>
<div id="formChoice" hidden><label>选择要填写的表单<select id="form"></select></label></div>
<section id="tracking" hidden><p id="targetState"></p><p id="domainWarning" class="notice"></p><div class="completion"><button id="undo" class="text-button">撤销填写</button><details><summary>记录已提交</summary><label><input id="confirmed" type="checkbox"> 我已在原网页手动提交</label><button id="markSubmitted" disabled>确认记录</button></details></div></section>
<section id="resources"><div class="section-heading"><h2>本地外链</h2><label class="file-button">选择文件<input id="resourceFile" type="file" accept=".json,.csv,.txt,.gz"></label></div><p id="sourceInfo">尚未选择外链文件</p><input id="resourceQuery" type="search" aria-label="搜索外链" placeholder="搜索域名、标题或平台">
<details class="filter-options"><summary>筛选</summary><div class="filters"><select id="resourceType" aria-label="资源类型"><option value="all">全部来源</option><option value="historical_blog">历史博客</option><option value="candidate">未验证候选</option></select><select id="resourceState" aria-label="工作状态"><option value="all">全部工作状态</option><option value="candidate">待处理</option><option value="filled">已填写</option><option value="submitted">手动确认已提交</option><option value="outcome_unknown">结果未知</option><option value="pending_review">等待审核</option><option value="published">已发现对应评论</option><option value="submit_failed">提交失败</option><option value="submit_paused">提交暂停</option><option value="skipped">已跳过</option><option value="review_needed">需复核</option></select><select id="resourceStatus" aria-label="历史状态"><option value="all">全部历史状态</option><option value="live">旧记录 live</option><option value="lost">旧记录 lost</option><option value="unknown">旧记录 unknown</option><option value="unverified">未验证</option></select></div></details>
<p id="resourceCount"></p><div id="resourceList"></div><nav><button id="resourcePrev" class="text-button">上一页</button><button id="resourceNext" class="text-button">下一页</button></nav></section></main>
<dialog id="settings"><p id="settingsStatus" role="status" aria-live="polite"></p><div class="dialog-heading"><h2>设置</h2><button id="closeSettings" class="text-button" aria-label="关闭设置">关闭</button></div><label>模型<input id="model" value="gpt-5.6-sol" autocomplete="off"></label><label>API Key <span id="keyState">尚未保存</span><input id="apiKey" type="password" autocomplete="new-password" placeholder="留空保留同源已保存 Key"></label><details><summary>高级模型参数</summary><label>模型服务 HTTPS 地址<input id="baseUrl" type="url" value="https://cubapi.codemao.cn/v1" autocomplete="off"></label><label>接口<select id="wire"><option value="responses">Responses</option><option value="chat_completions">Chat Completions</option></select></label><label>推理强度<select id="effort"><option>none</option><option>minimal</option><option selected>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select></label></details><button id="save">保存模型设置</button><button id="testConnection">测试连接</button><small>直接连接你配置的模型服务；Key 仅保存在本机扩展数据库，输入框不会回显。更换服务域名需要新 Key。</small><details><summary>导入产品资料与模型配置</summary><label>导入产品资料 / 一次性迁移文件<input id="profileFile" type="file" accept="application/json,.json"></label><p id="importSummary"></p><button id="applyProfile" disabled>应用已检查的导入文件</button><small>可导入 kit.json 或私有 browser-profile.json。迁移文件包含密钥，请勿分享；导入不会调用模型。</small></details><details><summary>文件与填写选项</summary><label><input id="autoSubmit" type="checkbox" checked> 填写后自动提交（每个目标仅一次）</label><button id="linkFile" class="secondary">关联本地原文件</button><button id="refreshFile" class="secondary" disabled>刷新关联文件</button><small>只读取你选择的文件；更新原文件后在此刷新。</small><label class="notice"><input id="events" type="checkbox"> 触发网页输入事件</label><small>用于兼容 React。网站可能自动保存或提交，请按需开启；默认仅填写空白字段。</small></details></dialog>
<script src="url-utils.js"></script><script src="local-api.js"></script><script src="autofill.js"></script><script src="sidepanel.js"></script></body></html>
